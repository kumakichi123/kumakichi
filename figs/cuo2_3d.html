<title>CuO₂面とギャップ対称性</title>
<style>
/* Layout: full-bleed 3D stage with a compact control panel overlaid at top-left */
:root{
  --bg:#f3f5f8; --fg:#1b2230; --muted:#5b6475; --panel:rgba(255,255,255,.88); --line:#d5dae3;
  --cu:#2c6fbb; --o:#d9483b; --plus:#d9483b; --minus:#2c6fbb;
  --ui:"Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--fg:#e6e9ef;--muted:#9aa3b2;--panel:rgba(24,29,38,.88);--line:#2f3644;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151c;--fg:#e6e9ef;--muted:#9aa3b2;--panel:rgba(24,29,38,.88);--line:#2f3644;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0}
.panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px)}
h1{font-size:16px;margin:0;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
label{font-size:13px;display:flex;align-items:center;gap:6px}
p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.lg{display:flex;gap:12px;font-size:12.5px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
</style>

<div id="stage"></div>
<div class="panel">
  <h1>CuO₂面とギャップの形（3D）</h1>
  <div class="row" role="group" aria-label="ギャップ">
    <button id="bd" aria-pressed="true">d波</button>
    <button id="bs" aria-pressed="false">s波</button>
    <button id="bn" aria-pressed="false">ギャップ非表示</button>
  </div>
  <label><input type="checkbox" id="lat" checked> 結晶格子を表示（CuO₂面×2層）</label>
  <div class="lg">
    <span><i class="dot" style="background:var(--cu)"></i>Cu</span>
    <span><i class="dot" style="background:var(--o)"></i>O</span>
    <span><i class="dot" style="background:var(--plus)"></i>ギャップ＋</span>
    <span><i class="dot" style="background:var(--minus)"></i>ギャップ−</span>
  </div>
  <p id="desc"></p>
  <p>ドラッグで回転、ホイール／ピンチで拡大縮小。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const css=getComputedStyle(document.documentElement);
const C=n=>new THREE.Color(css.getPropertyValue(n).trim());
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,200);
camera.position.set(9,-11,8); camera.up.set(0,0,1);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.target.set(0,0,0.6);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const dl=new THREE.DirectionalLight(0xffffff,.75); dl.position.set(5,-6,10); scene.add(dl);

// --- lattice: two CuO2 planes stacked along c (z) ---
const lattice=new THREE.Group(); scene.add(lattice);
const s=1.6, N=2, layers=[0,2.6];
const cuM=new THREE.MeshStandardMaterial({color:C('--cu'),roughness:.4});
const oM=new THREE.MeshStandardMaterial({color:C('--o'),roughness:.4});
const bondM=new THREE.MeshStandardMaterial({color:0x9aa3b2,roughness:.6});
const cuG=new THREE.SphereGeometry(.28,24,16), oG=new THREE.SphereGeometry(.17,20,12);
function bond(a,b){const d=new THREE.Vector3().subVectors(b,a);const g=new THREE.CylinderGeometry(.05,.05,d.length(),8);const m=new THREE.Mesh(g,bondM);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());lattice.add(m)}
for(const z of layers)for(let i=-N;i<=N;i++)for(let j=-N;j<=N;j++){
  const p=new THREE.Vector3(i*s,j*s,z);
  const cu=new THREE.Mesh(cuG,cuM);cu.position.copy(p);lattice.add(cu);
  if(i<N){const o=new THREE.Mesh(oG,oM);o.position.set(p.x+s/2,p.y,z);lattice.add(o);bond(p,new THREE.Vector3(p.x+s,p.y,z))}
  if(j<N){const o=new THREE.Mesh(oG,oM);o.position.set(p.x,p.y+s/2,z);lattice.add(o);bond(p,new THREE.Vector3(p.x,p.y+s,z))}
}

// --- axes ---
function label(t,col){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');x.font='bold 40px sans-serif';x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(t,64,32);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.scale.set(1.4,.7,1);return sp}
const fg='#'+C('--fg').getHexString();
[[1,0,0,'a軸'],[0,1,0,'b軸'],[0,0,1,'c軸']].forEach(([x,y,z,t])=>{
  const dir=new THREE.Vector3(x,y,z), L=z?5.2:4.8;
  const o=new THREE.Vector3(-N*s-0.9,-N*s-0.9,0);
  scene.add(new THREE.ArrowHelper(dir,o,L,C('--fg'),.4,.22));
  const l=label(t,fg);l.position.copy(o).addScaledVector(dir,L+.5);scene.add(l);
});

// --- gap shapes ---
// d_{x²-y²}: r = R·|sin²θ·cos2φ|, colored by sign of cos2φ (+ along a, − along b)
function gapMesh(kind){
  const R=kind==='d'?3.2:1.9, nt=90, np=180, pos=[], col=[], idx=[];
  const cp=C('--plus'), cm=C('--minus');
  for(let i=0;i<=nt;i++){const th=Math.PI*i/nt;
    for(let j=0;j<=np;j++){const ph=2*Math.PI*j/np;
      const v=kind==='d'?Math.sin(th)**2*Math.cos(2*ph):1;
      const r=R*Math.abs(v);
      pos.push(r*Math.sin(th)*Math.cos(ph),r*Math.sin(th)*Math.sin(ph),r*Math.cos(th)*(kind==='d'?1:.35));
      const c=v>=0?cp:cm;col.push(c.r,c.g,c.b);}}
  for(let i=0;i<nt;i++)for(let j=0;j<np;j++){const a=i*(np+1)+j,b=a+np+1;idx.push(a,b,a+1,b,b+1,a+1)}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,transparent:true,opacity:.72,side:THREE.DoubleSide,roughness:.5,depthWrite:false}));
  m.position.z=1.3;return m;
}
const gaps={d:gapMesh('d'),s:gapMesh('s')};
// node lines (45°) for d-wave
const nodes=new THREE.Group();
[45,135].forEach(a=>{const t=a*Math.PI/180;const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4.2*Math.cos(t),-4.2*Math.sin(t),1.3),new THREE.Vector3(4.2*Math.cos(t),4.2*Math.sin(t),1.3)]);
  const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:C('--muted'),dashSize:.25,gapSize:.18}));l.computeLineDistances();nodes.add(l)});
const nl=label('ノード','#'+C('--muted').getHexString());nl.position.set(3.3,3.3,1.6);nodes.add(nl);
gaps.d.add(nodes);nodes.position.z=-1.3;
scene.add(gaps.d,gaps.s);

const desc={
  d:'d波：a軸方向（赤）とb軸方向（青）でギャップの符号が逆。45°方向（点線）でギャップ0＝ノード。',
  s:'s波：どの方向でも同じ符号・同じ大きさ。a軸とb軸の区別がない。',
  n:'CuO₂面：Cu–O–Cuの結合がa軸・b軸に沿って並び、面はc軸方向に積み重なる。'};
function setMode(m){gaps.d.visible=m==='d';gaps.s.visible=m==='s';
  ['d','s','n'].forEach(k=>document.getElementById('b'+k).setAttribute('aria-pressed',k===m));
  document.getElementById('desc').textContent=desc[m];}
['d','s','n'].forEach(k=>document.getElementById('b'+k).onclick=()=>setMode(k));
document.getElementById('lat').onchange=e=>lattice.visible=e.target.checked;
setMode('d');

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  scene.background=C('--bg');}
addEventListener('resize',resize);resize();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>location.reload());
(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script>
